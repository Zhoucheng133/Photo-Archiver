name: photo_archiver
description: "photo archive tool"
publish_to: 'none'
version: 1.2.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter_localizations:
    sdk: flutter
  desktop_drop: ^0.6.1
  ffi: ^2.1.4
  file_picker: ^10.3.2
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  get: ^4.7.2
  msix: ^3.16.12
  package_info_plus: ^9.0.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  shared_preferences: ^2.5.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: "PuHui"
      fonts:
        - asset: fonts/AlibabaPuHuiTi-3-Regular.ttf

msix_config:
  display_name: PhotoArchiver
  publisher_display_name: ZhouCheng
  identity_name: ZhouCheng.PhotoArchiver
  msix_version: 1.2.0.0
  logo_path: assets/icon.png
  trim_logo: false
  capabilities: internetClient
  languages: zh-cn
  publisher: # Publisher HERE
  store: true